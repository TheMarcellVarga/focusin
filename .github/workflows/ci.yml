name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Verify domain behavior
        run: ./scripts/test-local.sh
      - name: Build local application bundle
        run: ./scripts/build-local.sh
      - name: Verify unsigned Release integrity
        run: ./scripts/release-preflight.sh
